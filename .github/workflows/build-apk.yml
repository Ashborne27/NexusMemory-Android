name: Build NexusMemory APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug -PNEXUS_TOKEN="$NEXUS_TOKEN"
          elif command -v gradle >/dev/null 2>&1; then
            gradle assembleDebug -PNEXUS_TOKEN="$NEXUS_TOKEN"
          else
            echo "gradlew introuvable et gradle non installé sur le runner"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: NexusMemory-v1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
